[package]
name = "aafbot"
version = "0.2.0"
edition = "2024"

[dependencies]
asahi = { git = "https://git.playground.red/nwerosama/asahi", branch = "master", features = ["prober", "coordinator", "sqlx-pg"] }
bytes = "1.11.1"
dashmap = "6.1.0"
extract_map = "0.3.1"
farmsim = { version = "0.2.1", features = ["fs22", "fs25"] }
futures = "0.3.32"
http-body-util = "0.1.3"
hyper = "1.8.1"
lazy_static = "1.5.0"
pin-project-lite = "0.2.17"
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "signal"] }

[[bin]]
name = "aaf"
path = "src/main.rs"

[features]
production = []

[profile]
dev.opt-level = 0
release.opt-level = 2
