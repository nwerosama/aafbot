[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/bot"]

[workspace.dependencies]
aaf_shared = { path = "crates/shared" }
asahi = { git = "https://git.playground.red/nwerosama/asahi", branch = "master", features = ["prober", "coordinator", "sqlx-pg"] }
farmsim = { version = "0.2.3", features = ["fs22", "fs25"] }
num-format = "0.4.4"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }

[profile]
dev.opt-level = 0
release.opt-level = 2
