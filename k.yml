apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaf-app

spec:
  replicas: 1
  revisionHistoryLimit: 6
  selector:
    matchLabels:
      app: aaf-app
  template:
    metadata:
      labels:
        app: aaf-app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: aaf-app
          image: ghcr.io/nwerosama/aafbot:sanke
          imagePullPolicy: Always
          env:
            - name: DOCKER_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: aaf-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "32Mi"
            limits:
              cpu: "1200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aafbot-service

spec:
  selector:
    app: aaf-app
  type: ClusterIP
  ports:
    - port: 9100
      targetPort: 9100
      name: health
